<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Здраве и Сила · стъкленият знак</title>
<link rel="icon" type="image/svg+xml" href="/shop/brand/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;800&display=swap">
<style>
  /* Стъкленият знак — следва мишката, удря при докосване. ?tone=light — на овес. */
  :root { --bg: #173F2E; --fg: #EEEAE1; --dim: #B9C9BE; }
  :root.light { --bg: #EEEAE1; --fg: #12140F; --dim: #4A4D44; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: 'Golos Text', system-ui, sans-serif; }
  .stage { position: fixed; inset: 0; touch-action: none; cursor: pointer; }
  canvas { width: 100%; height: 100%; display: block; }
  .name { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 9vh); text-align: center; font-weight: 800; letter-spacing: 0.02em; font-size: clamp(26px, 5vw, 48px); pointer-events: none; }
  .hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 4vh); text-align: center; color: var(--dim); font-size: 14px; pointer-events: none; }
  img.flat { position: fixed; inset: 0; margin: auto; width: 40vmin; display: none; }
</style>
</head>
<body>
<div class="stage" id="stage"><canvas id="c" aria-label="Знакът на Здраве и Сила — стъклено сърце, чиято дясна половина е стегната ръка"></canvas></div>
<img class="flat" id="flat" src="/shop/brand/mark.svg" alt="Знакът на Здраве и Сила">
<p class="name">ЗДРАВЕ И СИЛА</p>
<p class="hint">Докосни знака</p>
<script src="/cheatcode/vendor/three-r128.min.js"></script>
<script src="/shop/glass-mark.js"></script>
<script>
  const light = new URLSearchParams(location.search).get('tone') === 'light';
  if (light) document.documentElement.classList.add('light');
  fetch('/shop/brand/mark.svg').then((r) => r.text()).then((svg) => {
    const d = /\sd="([^"]+)"/.exec(svg)[1];
    const gm = GlassMark(document.getElementById('c'), { d, tone: light ? 'light' : 'dark', lift: 0.35 });
    if (!gm) { document.getElementById('flat').style.display = 'block'; return; }
    gm.idle(document.getElementById('stage'));
    window.gm = gm;
  });
</script>
</body>
</html>
