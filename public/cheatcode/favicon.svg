<!-- Favicon. Плътен кръг, защото на 16 пиксела прозрачният знак се губи
     в лентата с раздели, каквато и да е темата ѝ. Ходът е по-дебел от
     този на главния знак — на 16 пиксела 6.5 дава под два пиксела. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Cheat Code</title>
  <rect width="64" height="64" rx="14" fill="#1F6B4E"/>
  <g transform="translate(32 32) scale(0.66) translate(-32 -34)"
     fill="none" stroke="#F2F4EC" stroke-width="8.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 22 L32 9 L45 22"/>
    <path d="M19 38 L32 51 L45 38"/>
  </g>
</svg>
