<!-- Favicon. Плътен фон, защото на 16 пиксела прозрачен знак се губи в
     лентата с раздели. Ходът е по-дебел и заплитането по-широко —
     на този размер тънкото се слива в петно. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Cheat Code</title>
  <rect width="64" height="64" rx="14" fill="#1F6B4E"/>
  <mask id="fvCut">
    <rect width="64" height="64" fill="#fff"/>
    <g transform="translate(32 32) scale(0.68) translate(-32 -32) rotate(-35 32 32)">
      <rect x="28" y="22" width="30" height="20" rx="10" fill="none" stroke="#000" stroke-width="15"/>
    </g>
  </mask>
  <g transform="translate(32 32) scale(0.68) translate(-32 -32) rotate(-35 32 32)"
     fill="none" stroke="#F2F4EC" stroke-width="7.5" stroke-linecap="round">
    <rect x="6" y="22" width="30" height="20" rx="10" mask="url(#fvCut)"/>
    <rect x="28" y="22" width="30" height="20" rx="10"/>
  </g>
</svg>
