<!-- Профилно кръгче · основен вариант
     Смърчово поле, светъл знак. Плътният кръг се чете и на бял, и на тъмен
     фийд — прозрачен знак изчезва в единия от двата.
     Знакът се центрира по ОПТИЧНИТЕ си граници (център 32,34), не по
     кутията: иначе увисва надолу в кръга. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024">
  <title>Cheat Code</title>
  <circle cx="32" cy="32" r="32" fill="#1F6B4E"/>
  <g transform="translate(32 32) scale(0.62) translate(-32 -34)"
     fill="none" stroke="#F2F4EC" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 22 L32 9 L45 22"/>
    <path d="M19 38 L32 51 L45 38"/>
  </g>
</svg>
