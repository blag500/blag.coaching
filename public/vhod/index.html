<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Чийт Код — храна, настроена до грам. До вратата ти.">
<meta name="theme-color" content="#1E2923">
<!-- Страницата зад картата „Въведи кода" (cheatcode/brand/poster/kod.html).
     Един екран, без скрол (09.10: дългата версия от представянето за
     CoKitchen беше „прекалено дълга"): отговорът на загадката, трите ястия
     като заключени карти — докосване отключва и води към Чийт Код с ?ot=vhod.
     Тъмна, като картата, от която идва човекът. Без three.js. Без „в блока",
     „от съседа", цени и обяснения — заглавието, трите ястия с по един акцент
     и бутонът. Сплаш: стъкленият клип на Чийт Код. Редактира се направо. -->
<title>Чийт Код — кодът е приет</title>
<link rel="icon" href="/cheatcode/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Onest:wght@400;500;600;700&display=swap">
<style>
  :root { --ground: #1E2923; --ink: #E9F0EA; --soft: #B2C1B6; --faint: #8A9B8F; --mint: #4FBF8E;
          --pane: rgba(255,255,255,0.06); --pane-border: rgba(255,255,255,0.12); --r: 18px; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); }
  body { font-family: 'Onest', system-ui, sans-serif; color: var(--ink); font-feature-settings: 'locl' 0;
         -webkit-font-smoothing: antialiased; }
  /* Един екран: височината е видимата (svh), не цялата — в Safari лентата
     отдолу иначе изяжда бутона. Снимките и отстъпите се мерят по нея, за да
     се събере всичко и на по-нисък телефон. */
  .screen { height: 100svh; min-height: 560px; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column;
            padding: calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px);
            background:
              radial-gradient(ellipse 120% 45% at 50% 0%, rgba(79,191,142,0.20) 0%, transparent 65%),
              radial-gradient(ellipse 90% 40% at 100% 100%, rgba(90,120,200,0.10) 0%, transparent 65%); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .word { height: 14px; width: auto; display: block; }
  .ok { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; font-size: 13px; font-weight: 600;
        color: var(--mint); background: rgba(79,191,142,0.14); white-space: nowrap; }
  /* Два реда, всеки цял: размерът се мери по по-дългия („си знае числата ;)"),
     за да не се пречупи на нито един телефон. */
  h1 { font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: min(7.3vw, 38px); line-height: 1.1;
       letter-spacing: -0.01em; margin: 0; }
  h1 span { display: block; white-space: nowrap; }
  h1 .l2 { color: var(--mint); }
  /* Ястията: заключени — замъглена снимка, катинар и само акцентът на
     ястието, със знака и цвета от менюто на Чийт Код. Без цени: картата във
     входа е загадка, не ценоразпис. */
  /* Без бутон долу: ястията са бутоните. Три широки карти една под друга
     делят височината на екрана — страницата е пълна на всеки телефон. */
  .dishes { flex: 1; margin-top: clamp(14px, 3svh, 26px); display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .dish { position: relative; display: block; flex: 1; min-height: 92px; border-radius: var(--r); overflow: hidden;
          border: 1px solid var(--pane-border); text-decoration: none; }
  /* Заключено: снимката е замъглена — вижда се, че е храна, не коя точно —
     и отгоре катинар. Докосването го отключва и води към менюто. */
  .dish img { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); object-fit: cover; display: block;
              filter: blur(9px) brightness(0.72) saturate(1.1); transition: filter 380ms cubic-bezier(0.2,0.8,0.2,1); }
  .lock { position: absolute; right: 16px; top: 50%; z-index: 2; width: 52px; height: 52px; margin-top: -26px; border-radius: 50%;
          display: grid; place-items: center; color: var(--ink); background: rgba(20,28,24,0.45);
          border: 1px solid rgba(255,255,255,0.18); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
          transition: transform 240ms cubic-bezier(0.2,0.8,0.2,1), color 240ms; }
  .lock svg { grid-area: 1 / 1; width: 26px; height: 26px; transition: opacity 200ms; }
  .lock .open { opacity: 0; }
  .dish.unlocked img { filter: blur(0) brightness(0.85); }
  .dish.unlocked .lock { color: var(--mint); transform: scale(1.12); }
  .dish.unlocked .lock .shut { opacity: 0; } .dish.unlocked .lock .open { opacity: 1; }
  .dish::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,28,24,0.82) 0%, rgba(20,28,24,0.2) 70%); }
  .ins { position: absolute; left: 16px; right: 84px; bottom: 14px; z-index: 1; display: flex; align-items: center; gap: 8px;
         font-size: 17px; font-weight: 600; line-height: 1.2; }
  .ins svg { width: 24px; height: 24px; flex: none; }
  .ins.p { color: #5FB2F0; } .ins.c, .ins.g { color: #6FC475; }
  .mid { flex: 1; display: flex; flex-direction: column; min-height: 0; padding-top: clamp(14px, 3.5svh, 34px); }
  .hint { margin: 10px 0 0; font-size: 14px; color: var(--soft); }
  .splash { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; align-content: center; gap: 6px;
            background: var(--ground); transition: opacity 420ms cubic-bezier(0.2,0.8,0.2,1), visibility 420ms; }
  .splash.gone { opacity: 0; visibility: hidden; }
  .splash video { width: 230px; height: 230px; display: block; opacity: 0;
                  -webkit-mask-image: radial-gradient(closest-side, #000 82%, transparent); mask-image: radial-gradient(closest-side, #000 82%, transparent); }
  .splash.play video { opacity: 1; }
  /* Решетката зад веригата — същата като в сплаша на Чийт Код: клетка 23 px,
     клипът я носи в себе си на същите места. */
  .vwrap { position: relative; width: 230px; height: 230px; }
  .vwrap video { position: relative; }
  .vgrid { position: absolute; left: -230px; top: -230px; width: 690px; height: 690px; pointer-events: none;
           background-image: linear-gradient(to right, rgba(170,225,195,0.10) 1px, transparent 1px),
                             linear-gradient(to bottom, rgba(170,225,195,0.10) 1px, transparent 1px);
           background-size: 23px 23px;
           -webkit-mask-image: radial-gradient(closest-side, #000 38%, transparent); mask-image: radial-gradient(closest-side, #000 38%, transparent); }
  .splash .sw { height: 22px; width: auto; opacity: 0; transform: translateY(8px);
                transition: opacity 500ms cubic-bezier(0.2,0.8,0.2,1), transform 500ms cubic-bezier(0.2,0.8,0.2,1); }
  .splash.name .sw { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: no-preference) {
    .ok, h1, .hint, .dish { animation: up 520ms cubic-bezier(0.2,0.8,0.2,1) both; }
    h1 { animation-delay: 60ms; } .hint { animation-delay: 110ms; }
    .dish:nth-child(1) { animation-delay: 160ms; } .dish:nth-child(2) { animation-delay: 220ms; } .dish:nth-child(3) { animation-delay: 280ms; }
    /* Докато е сплашът, страницата чака — влиза, когато той си тръгне. */
    .screen.wait * { animation-play-state: paused; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="s-protein"><g fill="currentColor" opacity="0.32"><path d="M6.2 14.6c1.4 1.5 3.5 2.2 5.6 1.7.9-.2 1.6-.6 2.2-1.1-.5 1-1.2 1.8-2.5 2.1-2.4.5-4.7-.4-5.9-2.1a6 6 0 0 1-.4-.6z"/></g><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11.2c0-3.5 3.3-6.1 7.6-6.1 3.9 0 6.7 2.1 6.7 4.9 0 2-1.4 3.4-2.8 4.2-1.7 1-2.2 2.7-4.3 3.1-2.4.5-4.7-.4-5.9-2.1-1-1.4-1.3-2.6-1.3-4z"/><circle cx="9.1" cy="10.1" r="1.6"/><path d="M12.9 8.7c1.6.2 3 .7 4 1.4"/></g></g>
  <g id="s-carbs"><g fill="currentColor" opacity="0.32"><path d="M12 12.8c-2.3-.2-3.7-1.7-3.8-4 2.3.2 3.7 1.7 3.8 4z"/><path d="M12 12.8c2.3-.2 3.7-1.7 3.8-4-2.3.2-3.7 1.7-3.8 4z"/></g><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-8.2"/><path d="M12 8.6c-2-.2-3.2-1.6-3.3-3.6 2 .2 3.2 1.6 3.3 3.6z"/><path d="M12 8.6c2-.2 3.2-1.6 3.3-3.6-2 .2-3.2 1.6-3.3 3.6z"/></g></g>

  <g id="s-unlock"><rect x="5" y="10.5" width="14" height="10" rx="2.6" fill="currentColor" opacity="0.28"/><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.6"/><path d="M8 10.5V8a4 4 0 0 1 7.6-1.8"/><path d="M12 14.6v2"/></g></g>

<!-- Сплашът: същият стъклен клип като в Чийт Код (splash.mp4 — веригата
     се затваря, напъва и къса), на същата земя #1E2923, плюс името. Не тръгне
     ли клипът до 450 ms — само името. Веднъж на сесия. -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="vwrap"><i class="vgrid"></i>
    <video id="splashVid" muted playsinline preload="auto" src="/cheatcode/splash.mp4"></video>
  </div>
  <img class="sw" src="/vhod/wordmark.svg" alt="">
</div>
<main class="screen wait" id="screen">
  <div class="top">
    <img class="word" src="/vhod/wordmark.svg" alt="CHEATCODE">
    <span class="ok">✓ Кодът е приет</span>
  </div>

  <div class="mid">
  <h1><span class="l1">Храната, която</span><span class="l2">си знае числата ;)</span></h1>
  <p class="hint">Три ястия са заключени. Докосни едно.</p>

  <div class="dishes">
    <a class="dish" href="/cheatcode/?ot=vhod" aria-label="Телешки боул — 66 г протеин"><img src="/cheatcode/kayma.jpg" alt=""><span class="lock"><svg class="shut"><use href="#s-lock"/></svg><svg class="open"><use href="#s-unlock"/></svg></span><span class="ins p"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#s-protein"/></svg>66 г протеин</span></a>
    <a class="dish" href="/cheatcode/?ot=vhod" aria-label="Анаболно кремче — без добавена захар"><img src="/cheatcode/yagodi.jpg" alt=""><span class="lock"><svg class="shut"><use href="#s-lock"/></svg><svg class="open"><use href="#s-unlock"/></svg></span><span class="ins g"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#s-check"/></svg>Без добавена захар</span></a>
    <a class="dish" href="/cheatcode/?ot=vhod" aria-label="Грис на стероиди — 106 г въглехидрати"><img src="/cheatcode/gris-choko.jpg" alt=""><span class="lock"><svg class="shut"><use href="#s-lock"/></svg><svg class="open"><use href="#s-unlock"/></svg></span><span class="ins c"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#s-carbs"/></svg>106 г въглехидрати</span></a>
  </div>
  </div>

</main>
<script>
(function () {
  var el = document.getElementById('splash'), v = document.getElementById('splashVid');
  var seen = false;
  try { seen = sessionStorage.getItem('vhod_splash') === '1'; sessionStorage.setItem('vhod_splash', '1'); } catch (e) {}
  var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var screen = document.getElementById('screen');
  if (seen || still) { el.remove(); screen.classList.remove('wait'); return; }
  var gone = false;
  function leave() { if (gone) return; gone = true; el.classList.add('gone'); screen.classList.remove('wait'); setTimeout(function () { el.remove(); }, 450); }
  /* Името идва в мига на скъсването (54 % от клипа, ~0.9 s), както в Чийт Код. */
  function name(at) { setTimeout(function () { el.classList.add('name'); }, at); }
  var started = false;
  v.addEventListener('playing', function () {
    if (started) return; started = true;
    el.classList.add('play'); name(880); setTimeout(leave, 2100);
  });
  var p = v.play(); if (p && p.catch) p.catch(function () {});
  setTimeout(function () { if (!started) { started = true; v.remove(); name(0); setTimeout(leave, 900); } }, 450);
  el.addEventListener('click', leave);
  setTimeout(leave, 3200);
})();
</script>
<script>
/* Докосване по ястие: катинарът се отваря, снимката се избистря, после —
   към менюто. 350 ms стигат да се види, без да е чакане. */
document.querySelectorAll('.dish').forEach(function (a) {
  a.addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey || a.classList.contains('unlocked')) return;
    e.preventDefault();
    a.classList.add('unlocked');
    setTimeout(function () { location.href = a.href; }, 350);
  });
});
/* Назад от менюто: браузърът връща страницата от паметта си (bfcache), както
   е била — с отключения катинар. При всяко показване всичко се заключва пак. */
addEventListener('pageshow', function () {
  document.querySelectorAll('.dish.unlocked').forEach(function (a) { a.classList.remove('unlocked'); });
});
</script>
</body>
