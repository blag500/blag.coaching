<!--
  Confirm-signup email for Blag Coaching.

  This is the source of truth for the template that lives in the Supabase
  dashboard (Authentication → Emails → "Confirm signup"). Nothing in the build
  ships it — paste the contents here into that field after editing.

  Email is not a browser: no external CSS, no flexbox, no custom fonts you can
  rely on. So it is one table, every colour inline, and a system display stack
  that falls back gracefully where Oswald cannot load. The gold is a flat swatch
  rather than the app's brushed-metal ramp, because background-clip text is blank
  in most inboxes.

  The one moving part is {{ .ConfirmationURL }} — Supabase fills it. The raw
  address is printed under the button too, for the clients that strip the button.
-->
<div style="margin:0;padding:0;background:#0C0A06;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0C0A06" style="background:#0C0A06;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:40px 20px;">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:460px;width:100%;">

          <!-- Wordmark -->
          <tr>
            <td align="center" style="padding:8px 0 6px;">
              <div style="font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-size:52px;font-weight:600;letter-spacing:14px;text-indent:14px;color:#E4CE94;line-height:1;">BLAG</div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 0 4px;">
              <div style="width:40px;height:1px;background:#B08A45;line-height:1px;font-size:0;">&nbsp;</div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:6px 0 30px;">
              <div style="font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-size:13px;font-weight:400;letter-spacing:9px;text-indent:9px;color:#8A7B5C;line-height:1;">COACHING</div>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background:#15110B;border:1px solid rgba(255,183,77,0.16);border-radius:16px;padding:36px 30px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-size:22px;font-weight:500;letter-spacing:2px;color:#F2E8CF;padding:0 0 14px;">
                    ЕДНА СТЪПКА ДО СТАРТА
                  </td>
                </tr>
                <tr>
                  <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#A99B7C;padding:0 0 28px;">
                    Потвърди имейла си и акаунтът ти е готов — макроси, храна, тренировки и напредък на едно място.
                  </td>
                </tr>

                <!-- Button -->
                <tr>
                  <td align="center" style="padding:0 0 22px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" bgcolor="#ffb74d" style="border-radius:12px;">
                          <a href="{{ .ConfirmationURL }}" target="_blank"
                             style="display:inline-block;padding:16px 40px;font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-size:16px;font-weight:600;letter-spacing:2px;color:#0C0A06;text-decoration:none;border-radius:12px;">
                            ПОТВЪРДИ АКАУНТА
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <!-- Raw link fallback -->
                <tr>
                  <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.6;color:#6B6047;padding:0 0 4px;">
                    Ако бутонът не работи, отвори този адрес:
                  </td>
                </tr>
                <tr>
                  <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.6;word-break:break-all;padding:0;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="color:#C8A05A;text-decoration:underline;">{{ .ConfirmationURL }}</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.6;color:#5C5238;padding:24px 10px 0;">
              Не си създавал акаунт? Просто игнорирай това писмо.
            </td>
          </tr>
          <tr>
            <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#3E3826;padding:10px 0 0;">
              © Blag Coaching
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</div>
