<!--
  Confirm-signup email for Blag Coaching.

  Source of truth for the template that lives in the Supabase dashboard
  (Authentication → Emails → "Confirm signup"). Nothing in the build ships it —
  paste the contents here into that field after editing.

  The primary CTA is the 6-digit {{ .Token }} — the client enters it in the same
  screen where they signed up, so a Safari-only confirm link never traps a PWA
  install in the wrong context. The {{ .ConfirmationURL }} lives on as a small
  fallback for anyone who prefers a click.

  Identity matches the Splash: the arms mark above the BLAG wordmark, the
  COACHING kicker in the same weight, a hairline gold divider, and the
  "Be blag, Be better" tagline. `arms-hi.webp` is fetched from the production
  domain — email cannot embed local assets, and remote images are blocked until
  the reader taps "Show images", so the design still reads without it (the
  typography carries the mark on its own).

  No external CSS, no flexbox, no custom fonts we can rely on. One table, every
  colour inline, a system display stack that falls back gracefully where Oswald
  cannot load. Brushed-gold gradients are traded for a flat swatch — inline
  `background-clip: text` renders as empty in most inboxes.
-->
<div style="margin:0;padding:0;background:#0C0A06;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0C0A06" style="background:#0C0A06;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:40px 20px;">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:460px;width:100%;">

          <!-- Arms mark — the same silhouette that flanks BLAG on the splash,
               centred above the wordmark here so a single image reads clean in
               every inbox. Alt text is empty on purpose: with images off, the
               typography carries the mark and a stand-in caption would double
               the wordmark below. -->
          <tr>
            <td align="center" style="padding:0 0 12px;">
              <img src="https://blag-coaching.com/arms-hi.webp" alt="" width="140"
                   style="display:block;width:140px;max-width:60%;height:auto;border:0;outline:none;text-decoration:none;" />
            </td>
          </tr>

          <!-- Wordmark -->
          <tr>
            <td align="center" style="padding:4px 0 4px;">
              <div style="font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-size:52px;font-weight:600;letter-spacing:14px;text-indent:14px;color:#E4CE94;line-height:1;">BLAG</div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:6px 0 4px;">
              <div style="font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-size:20px;font-weight:600;letter-spacing:9px;text-indent:9px;color:#C8A05A;line-height:1;">COACHING</div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:14px 0 8px;">
              <div style="width:56px;height:1px;background:#B08A45;line-height:1px;font-size:0;">&nbsp;</div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 0 28px;">
              <div style="font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-size:11px;font-weight:400;letter-spacing:6px;text-indent:6px;color:#8A7B5C;line-height:1;text-transform:uppercase;">Be blag, Be better</div>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background:#15110B;border:1px solid rgba(255,183,77,0.16);border-radius:16px;padding:36px 30px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-size:22px;font-weight:500;letter-spacing:2px;color:#F2E8CF;padding:0 0 14px;">
                    ЕДНА СТЪПКА ДО СТАРТА
                  </td>
                </tr>
                <tr>
                  <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#A99B7C;padding:0 0 22px;">
                    Въведи този код в приложението, за да завършиш регистрацията.
                  </td>
                </tr>

                <!-- OTP code — the primary CTA. Big, spaced, tabular so the six
                     digits read as a single object rather than a running number. -->
                <tr>
                  <td align="center" style="padding:0 0 22px;">
                    <div style="display:inline-block;background:#0C0A06;border:1px solid rgba(255,183,77,0.28);border-radius:14px;padding:20px 28px;">
                      <div style="font-family:'Menlo','Consolas','Courier New',monospace;font-size:34px;font-weight:600;letter-spacing:10px;text-indent:10px;color:#ffb74d;line-height:1;">
                        {{ .Token }}
                      </div>
                    </div>
                  </td>
                </tr>

                <tr>
                  <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.6;color:#6B6047;padding:0 0 22px;">
                    Кодът е валиден 1 час.
                  </td>
                </tr>

                <!-- Divider -->
                <tr>
                  <td align="center" style="padding:0 0 18px;">
                    <div style="width:40px;height:1px;background:rgba(255,183,77,0.22);line-height:1px;font-size:0;">&nbsp;</div>
                  </td>
                </tr>

                <!-- Fallback link — quieter, for clients who prefer clicking. -->
                <tr>
                  <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#6B6047;padding:0 0 6px;">
                    Или потвърди с един клик:
                  </td>
                </tr>
                <tr>
                  <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;padding:0;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="color:#C8A05A;text-decoration:underline;">Потвърди в браузър</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.6;color:#5C5238;padding:24px 10px 0;">
              Не си създавал акаунт? Просто игнорирай това писмо.
            </td>
          </tr>
          <tr>
            <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#3E3826;padding:10px 0 0;">
              © Blag Coaching
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</div>
