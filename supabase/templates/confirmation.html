<!--
  Confirm-signup email for Blag Coaching.

  Source of truth for the template that lives in the Supabase dashboard
  (Authentication → Emails → "Confirm signup"). Nothing in the build ships it —
  paste the contents here into that field after editing.

  The primary CTA is the 6-digit {{ .Token }} — the client enters it in the same
  screen where they signed up, so a Safari-only confirm link never traps a PWA
  install in the wrong context. The {{ .ConfirmationURL }} lives on as a small
  fallback for anyone who prefers a click.

  The header is one image: the finished lockup — arms, wordmark and tagline
  already set — rather than parts assembled with table cells and web type.

  It was three pieces: two arm JPGs above type in Oswald. Two things broke.
  The JPGs had the transparency chequerboard baked into the pixels, so every
  inbox showed the arms sitting on a grid; and Oswald never loads in mail, so
  the wordmark fell back to Arial Narrow and stopped being the mark. A finished
  image has neither problem — and a logo assembled from parts is a logo that
  can come apart, which in email it always eventually does.

  Email is not a browser: no external CSS, no flexbox, no custom fonts we can
  rely on. One table, every colour inline, a system display stack that falls
  back gracefully where Oswald cannot load. Brushed-gold gradients are traded
  for a flat swatch — inline `background-clip: text` renders blank in most
  inboxes.
-->
<div style="margin:0;padding:0;background:#0C0A06;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0C0A06" style="background:#0C0A06;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:40px 20px;">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:460px;width:100%;">

          <!-- One picture, 600px wide, shown at 300. Retina gets the pixels it
               wants and the file stays under 200KB, which is what keeps Gmail
               from clipping the message. -->
          <tr>
            <td align="center" style="padding:8px 0 30px;">
              <img src="https://blag-coaching.com/email-logo.png"
                   alt="BLAG COACHING — Be blag, be better" width="300"
                   style="display:block;width:300px;max-width:100%;height:auto;border:0;outline:none;text-decoration:none;" />
            </td>
          </tr>

          <tr>
            <td style="background:#15110B;border:1px solid rgba(200,160,90,0.18);border-radius:16px;padding:32px 24px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-size:22px;font-weight:500;letter-spacing:2px;color:#F2E8CF;padding:0 0 14px;">
                    ЕДНА СТЪПКА ДО СТАРТА
                  </td>
                </tr>
                <tr>
                  <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#A99B7C;padding:0 0 22px;">
                    Въведи този код в приложението, за да завършиш регистрацията.
                  </td>
                </tr>

                <!-- OTP code — the primary CTA. Rendered as a single-cell table
                     rather than nested divs: iOS Mail ignores white-space:nowrap
                     on divs and wraps 8-digit tokens onto two lines. A <td>
                     shrink-wraps to its content and never breaks unless there is
                     whitespace inside — {{ .Token }} has none, so the whole run
                     stays on one line by geometry, not by CSS suggestion. -->
                <tr>
                  <td align="center" style="padding:0 0 22px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                      <tr>
                        <td align="center" bgcolor="#0C0A06" style="background:#0C0A06;border:1px solid rgba(200,160,90,0.32);border-radius:14px;padding:18px 24px;font-family:'Menlo','Consolas','Courier New',monospace;font-size:26px;font-weight:600;letter-spacing:5px;text-indent:5px;color:#E4CE94;line-height:1;white-space:nowrap;">
                          {{ .Token }}
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <tr>
                  <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.6;color:#6B6047;padding:0 0 22px;">
                    Кодът е валиден 1 час.
                  </td>
                </tr>

                <!-- Divider -->
                <tr>
                  <td align="center" style="padding:0 0 18px;">
                    <div style="width:40px;height:1px;background:rgba(200,160,90,0.24);line-height:1px;font-size:0;">&nbsp;</div>
                  </td>
                </tr>

                <!-- Fallback link — quieter, for clients who prefer clicking. -->
                <tr>
                  <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#6B6047;padding:0 0 6px;">
                    Или потвърди с един клик:
                  </td>
                </tr>
                <tr>
                  <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;padding:0;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="color:#C8A05A;text-decoration:underline;">Потвърди в браузър</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.6;color:#5C5238;padding:24px 10px 0;">
              Не си създавал акаунт? Просто игнорирай това писмо.
            </td>
          </tr>
          <tr>
            <td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#3E3826;padding:10px 0 0;">
              © Blag Coaching
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</div>
