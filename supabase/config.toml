project_id = "eiltoadzaqbuqdilsfpi"

# send-reminders is called by pg_cron through net.http_post, which sends no
# Authorization header — so the platform's JWT check rejects it before the
# function ever runs. It guards itself instead, with REMINDER_SECRET in the
# query string, which is the only credential cron can carry.
#
# This is written down rather than passed as a deploy flag because a plain
# `supabase functions deploy send-reminders` silently restores the default and
# takes every morning reminder down with it. It has happened once.
[functions.send-reminders]
verify_jwt = false

# streak-guard се вика от pg_cron по същия път и със същото ограничение като
# send-reminders: без Authorization header, значи без JWT проверка. Пази се
# сам със STREAK_SECRET в адреса.
[functions.streak-guard]
verify_jwt = false

# bot-watch се вика от разписанието в базата, точно като горните две: без
# Authorization header, значи без JWT проверка. Пази се сам с REMINDER_SECRET
# в адреса. Без този ред всяко пускане на функцията връща подразбирането и
# нощната обиколка спира тихо.
[functions.bot-watch]
verify_jwt = false

# knowledge се вика и от скрипт за синхронизация без вход в приложението: там
# няма Authorization заглавка, а x-bot-secret. Пази се сам.
[functions.knowledge]
verify_jwt = false
