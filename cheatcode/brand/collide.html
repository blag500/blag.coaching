<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;width:820px;background:#141C18;color:#E9F0EA;font-family:'Onest',sans-serif;padding:26px}
h1{font-size:17px;font-weight:800;margin:0 0 6px}
p.l{font-size:12.5px;color:#A3B3A7;margin:0 0 20px;line-height:1.5}
.row{display:flex;align-items:center;gap:34px;background:#0F1613;border-radius:14px;padding:22px;margin-bottom:12px}
.u{display:grid;justify-items:center;gap:7px}
.cap{font-size:10px;color:#74857A;text-align:center;max-width:110px;line-height:1.35}
select,input{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;
  border:1px solid #35473D;background:#1B251F;color:#E9F0EA}
.g{filter:invert(78%) sepia(35%) saturate(700%) hue-rotate(96deg)}
.step{display:inline-grid;gap:1px;background:#1B251F;border:1px solid #35473D;border-radius:6px;padding:3px 5px}
.step i{font-style:normal;font-size:9px;line-height:1;color:#A3B3A7}
</style></head><body>
<h1>Знакът срещу интерфейсните стрелки</h1>
<p class="l">Същият размер, същият екран. Ако знакът се чете като контрола, той не е знак —
както плъзгачът се четеше като бутона за филтри.</p>

<div class="row">
  <span class="u"><img src="mark.svg" width="34" class="g"><span class="cap">нашият знак 34px</span></span>
  <span class="u"><select><option>Средна</option></select><span class="cap">&lt;select&gt; — 13 в апа</span></span>
  <span class="u"><input type="number" value="100" style="width:78px"><span class="cap">number — 80 в апа</span></span>
  <span class="u"><span class="step"><i>▲</i><i>▼</i></span><span class="cap">типичен стъпков бутон</span></span>
  <span class="u"><img src="mark-small.svg" width="18" class="g"><span class="cap">знакът 18px</span></span>
</div>

<div class="row" style="background:#1F6B4E">
  <span class="u"><img src="avatar.svg" width="52" style="border-radius:50%"><span class="cap" style="color:#CFE6DA">кръгче 52</span></span>
  <span class="u"><img src="avatar.svg" width="34" style="border-radius:50%"><span class="cap" style="color:#CFE6DA">34</span></span>
  <span class="u"><span class="step" style="background:#1F6B4E;border-color:#4FBF8E"><i style="color:#CFE6DA">▲</i><i style="color:#CFE6DA">▼</i></span><span class="cap" style="color:#CFE6DA">стъпков бутон</span></span>
</div>
</body></html>
