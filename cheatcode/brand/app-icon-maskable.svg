<!-- Иконка на приложението · квадрат, не кръгче
     Цветовете са на кръгчето в хедъра: ментово поле, тъмна верига.
     Геометрията е на chain.svg. Иконката и знакът, с който се отваря
     приложението, са едно и също нещо.
     Вариантът за изрязване (Android „maskable"): телефонът реже формата сам
     — кръг, капка, заоблен квадрат — и гарантира само кръг с 80% диаметър.
     Затова знакът е на 60%, вътре в него. Иначе същото като app-icon.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024">
  <title>Cheat Code</title>
  <rect width="64" height="64" fill="#4FBF8E"/>
  <mask id="icCutM">
    <rect width="64" height="64" fill="#fff"/>
    <rect x="27" y="23" width="31" height="18" rx="9"
          fill="none" stroke="#000" stroke-width="12"/>
  </mask>
  <g transform="translate(32 32) scale(0.6) translate(-32 -32)">
    <g transform="rotate(-35 32 32)" fill="none" stroke="#141C18"
       stroke-width="5.5" stroke-linecap="round">
      <rect x="6" y="23" width="31" height="18" rx="9" mask="url(#icCutM)"/>
      <rect x="27" y="23" width="31" height="18" rx="9"/>
    </g>
  </g>
</svg>
