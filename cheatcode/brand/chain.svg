<!-- CHEAT CODE · едрият знак
     Късаща се верига. Звеното е капсула, не кръг, и двете звена са
     отместени по оста — застъпват се само с краищата си. Заплитането е
     маска: дебело копие на предното звено, което яде точно там, където
     то минава над задното.

     Само за 40 пиксела и нагоре. Под това скъсването изчезва и знакът
     става обикновено звено от верига, тоест иконката за хипервръзка.
     За малките места има друг знак — mark.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Cheat Code">
  <title>Cheat Code</title>
  <defs>
    <mask id="ccChainCut">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M34 23 h10 a9 9 0 0 1 9 9" fill="none" stroke="#000" stroke-width="12"/>
    </mask>
  </defs>
  <g transform="translate(2 -2.2) rotate(-35 32 32)" fill="none" stroke="currentColor"
     stroke-width="5.5" stroke-linecap="round">
    <rect x="6" y="23" width="31" height="18" rx="9" mask="url(#ccChainCut)"/>
    <path d="M32 23 h12 a9 9 0 0 1 8.5 6"/>
    <path d="M32 41 h12 a9 9 0 0 0 8.5 -6"/>
  </g>
</svg>
