<!-- CHEAT CODE · знакът
     Две цели заплетени звена. Звеното е капсула, не кръг, и двете са
     отместени по оста си — застъпват се само с краищата. Заплитането е
     маска: дебело копие на предното звено, което яде точно там, където
     то минава над задното, и никъде другаде. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Cheat Code">
  <title>Cheat Code</title>
  <defs>
    <mask id="ccChainCut">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="27" y="23" width="31" height="18" rx="9"
            fill="none" stroke="#000" stroke-width="12"/>
    </mask>
  </defs>
  <g transform="rotate(-35 32 32)" fill="none" stroke="currentColor"
     stroke-width="5.5" stroke-linecap="round">
    <rect x="6" y="23" width="31" height="18" rx="9" mask="url(#ccChainCut)"/>
    <rect x="27" y="23" width="31" height="18" rx="9"/>
  </g>
</svg>
