<!-- Иконка на приложението · квадрат, не кръгче
     Тъмно поле, ментова верига — геометрията на chain.svg, цветовете на
     avatar-dark. Полето е фонът на самото приложение: иконката се отваря
     в екран със същия цвят, без проблясване.
     Телефонът сам реже формата (кръг, заоблен квадрат, капка), затова полето
     стига до ръбовете, а знакът стои в средните 60% — вътре в безопасната
     зона на „maskable" (кръг с 80% диаметър). Прозрачен ъгъл iOS боядисва
     в черно. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024">
  <title>Cheat Code</title>
  <rect width="64" height="64" fill="#141C18"/>
  <mask id="icCut">
    <rect width="64" height="64" fill="#fff"/>
    <rect x="27" y="23" width="31" height="18" rx="9"
          fill="none" stroke="#000" stroke-width="12"/>
  </mask>
  <g transform="translate(32 32) scale(0.6) translate(-32 -32)">
    <g transform="rotate(-35 32 32)" fill="none" stroke="#4FBF8E"
       stroke-width="5.5" stroke-linecap="round">
      <rect x="6" y="23" width="31" height="18" rx="9" mask="url(#icCut)"/>
      <rect x="27" y="23" width="31" height="18" rx="9"/>
    </g>
  </g>
</svg>
