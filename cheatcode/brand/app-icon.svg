<!-- Иконка на приложението · квадрат, не кръгче
     Телефонът сам реже формата (кръг, заоблен квадрат, капка) — затова полето
     стига до ръбовете, а знакът стои в средните 60%, вътре в безопасната зона
     на „maskable" (кръг с 80% диаметър). Прозрачен ъгъл iOS боядисва в черно. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="1024" height="1024">
  <rect width="64" height="64" fill="#1F6B4E"/>
  <mask id="icCut">
    <rect width="64" height="64" fill="#fff"/>
    <g transform="translate(32 32) scale(0.6) translate(-32 -32) rotate(-35 32 32)">
      <rect x="27" y="23" width="31" height="18" rx="9" fill="none" stroke="#000" stroke-width="12"/>
    </g>
  </mask>
  <g transform="translate(32 32) scale(0.6) translate(-32 -32) rotate(-35 32 32)"
     fill="none" stroke="#F2F4EC" stroke-width="6.5" stroke-linecap="round">
    <rect x="6" y="23" width="31" height="18" rx="9" mask="url(#icCut)"/>
    <rect x="27" y="23" width="31" height="18" rx="9"/>
  </g>
</svg>
