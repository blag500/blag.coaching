<!-- В6 · Скъсването е събитието, не подробността
     Второто звено е разтворено широко и двата му края са отскочили
     навън. Ако „късаща се" е идеята, тя трябва да оцелее на 18 пиксела —
     а оцелява само ако дупката е по-голяма от хода. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <mask id="cut6">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M34 23 h10 a9 9 0 0 1 9 9" fill="none" stroke="#000" stroke-width="12"/>
    </mask>
  </defs>
  <g transform="rotate(-35 32 32)" fill="none" stroke="currentColor"
     stroke-width="5.5" stroke-linecap="round">
    <rect x="6" y="23" width="31" height="18" rx="9" mask="url(#cut6)"/>
    <!-- горно рамо: тръгва от заплитането и свършва рано, извито навън -->
    <path d="M32 23 h12 a9 9 0 0 1 8.5 6"/>
    <!-- долно рамо: огъва се надолу и също спира, с разтвор между двете -->
    <path d="M32 41 h12 a9 9 0 0 0 8.5 -6"/>
  </g>
</svg>
