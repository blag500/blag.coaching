<!-- В1 · Две звена, второто късащо се
     Звеното е КАПСУЛА, не кръг — това беше грешката първия път.
     Заплитането се прави с маска: задното звено губи парче точно там,
     където предното минава над него. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <mask id="m1">
    <rect width="64" height="64" fill="#fff"/>
    <!-- дупката, през която минава предното звено -->
    <g transform="rotate(-45 32 32)">
      <rect x="20" y="20" width="24" height="24" rx="12" fill="#000" stroke="#000" stroke-width="11"/>
    </g>
  </mask>
  <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
    <!-- задно звено, прекъснато от маската -->
    <g mask="url(#m1)" transform="rotate(-45 32 32)">
      <rect x="14" y="24" width="36" height="17" rx="8.5"/>
    </g>
    <!-- предно звено, но СКЪСАНО: горният му край е отворен и разтворен -->
    <g transform="rotate(-45 32 32)">
      <path d="M32 12 h-6 a8.5 8.5 0 0 0 -8.5 8.5 v0 a8.5 8.5 0 0 0 8.5 8.5 h12
               a8.5 8.5 0 0 1 8.5 8.5"/>
      <path d="M45 15 a8.5 8.5 0 0 0 -7 -3"/>
    </g>
  </g>
</svg>
