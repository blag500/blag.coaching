<!-- В5 · Същото, но второто звено поддава
     Веригата се държи отляво и се отваря отдясно. Отвореният край е
     разтворен навън — звеното не е отрязано, а е поддало. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <mask id="cut5">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M36 23 h13 a9 9 0 0 1 9 9 v0 a9 9 0 0 1 -9 9 h-13"
            fill="none" stroke="#000" stroke-width="12"/>
    </mask>
  </defs>
  <g transform="rotate(-35 32 32)" fill="none" stroke="currentColor"
     stroke-width="5.5" stroke-linecap="round">
    <rect x="6" y="23" width="31" height="18" rx="9" mask="url(#cut5)"/>
    <!-- отворено звено: горната дъга свършва по-рано и отскача -->
    <path d="M40 23 h9 a9 9 0 0 1 9 9 a9 9 0 0 1 -9 9 h-13"/>
    <path d="M43 19 a9 9 0 0 0 -7 3"/>
  </g>
</svg>
