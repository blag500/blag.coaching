<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#141C18;--card:#1B251F;--ink:#E9F0EA;--faint:#74857A;--acc:#4FBF8E}
*{box-sizing:border-box}
body{margin:0;width:700px;background:var(--bg);color:var(--ink);font-family:'Onest',sans-serif;padding:24px}
h1{font-size:17px;font-weight:800;margin:0 0 14px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:var(--card);border:1px solid #2A3A32;border-radius:16px;padding:14px 11px}
.nm{font-size:12px;font-weight:800;margin:0 0 8px}
.big{display:grid;place-items:center;height:104px;background:#0F1613;border-radius:12px;color:var(--acc)}
.sizes{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:7px;padding:9px;background:#0F1613;border-radius:12px;color:var(--ink)}
.circ{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:7px;padding:9px;background:#0F1613;border-radius:12px}
.av{background:#1F6B4E;border-radius:50%;display:grid;place-items:center}
.u{display:grid;justify-items:center}.cap{font-size:8.5px;color:var(--faint);margin-top:3px}
.g{filter:invert(78%) sepia(35%) saturate(700%) hue-rotate(96deg)}
.w{filter:brightness(0) invert(1)}
.lt{background:#F2F4EC;margin-top:7px;padding:9px;border-radius:12px;display:flex;gap:12px;align-items:center;justify-content:center}
</style></head><body>
<h1>Късаща се верига с проектили</h1><div class="row">
<div class="card"><div class="nm">П7 · три парчета</div>
<div class="big"><img src="p7-shards.svg" width="90" class="g"></div>
<div class="sizes">
  <span class="u"><img src="p7-shards.svg" width="48" class="g"><span class="cap">48</span></span>
  <span class="u"><img src="p7-shards.svg" width="32" class="g"><span class="cap">32</span></span>
  <span class="u"><img src="p7-shards.svg" width="22" class="g"><span class="cap">22</span></span>
  <span class="u"><img src="p7-shards.svg" width="16" class="g"><span class="cap">16</span></span>
</div>
<div class="circ">
  <span class="u"><span class="av" style="width:56px;height:56px"><img src="p7-shards.svg" width="36" class="w"></span><span class="cap">56</span></span>
  <span class="u"><span class="av" style="width:34px;height:34px"><img src="p7-shards.svg" width="22" class="w"></span><span class="cap">34</span></span>
</div>
<div class="lt"><img src="p7-shards.svg" width="44"><img src="p7-shards.svg" width="24"></div>
</div>
<div class="card"><div class="nm">П8 · лъчи вместо парчета</div>
<div class="big"><img src="p8-burst.svg" width="90" class="g"></div>
<div class="sizes">
  <span class="u"><img src="p8-burst.svg" width="48" class="g"><span class="cap">48</span></span>
  <span class="u"><img src="p8-burst.svg" width="32" class="g"><span class="cap">32</span></span>
  <span class="u"><img src="p8-burst.svg" width="22" class="g"><span class="cap">22</span></span>
  <span class="u"><img src="p8-burst.svg" width="16" class="g"><span class="cap">16</span></span>
</div>
<div class="circ">
  <span class="u"><span class="av" style="width:56px;height:56px"><img src="p8-burst.svg" width="36" class="w"></span><span class="cap">56</span></span>
  <span class="u"><span class="av" style="width:34px;height:34px"><img src="p8-burst.svg" width="22" class="w"></span><span class="cap">34</span></span>
</div>
<div class="lt"><img src="p8-burst.svg" width="44"><img src="p8-burst.svg" width="24"></div>
</div>
<div class="card"><div class="nm">П9 · две едри парчета</div>
<div class="big"><img src="p9-heavy.svg" width="90" class="g"></div>
<div class="sizes">
  <span class="u"><img src="p9-heavy.svg" width="48" class="g"><span class="cap">48</span></span>
  <span class="u"><img src="p9-heavy.svg" width="32" class="g"><span class="cap">32</span></span>
  <span class="u"><img src="p9-heavy.svg" width="22" class="g"><span class="cap">22</span></span>
  <span class="u"><img src="p9-heavy.svg" width="16" class="g"><span class="cap">16</span></span>
</div>
<div class="circ">
  <span class="u"><span class="av" style="width:56px;height:56px"><img src="p9-heavy.svg" width="36" class="w"></span><span class="cap">56</span></span>
  <span class="u"><span class="av" style="width:34px;height:34px"><img src="p9-heavy.svg" width="22" class="w"></span><span class="cap">34</span></span>
</div>
<div class="lt"><img src="p9-heavy.svg" width="44"><img src="p9-heavy.svg" width="24"></div>
</div>
</div></body></html>
