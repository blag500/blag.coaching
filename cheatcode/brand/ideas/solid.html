<!doctype html><html lang="bg"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#141C18;--card:#1B251F;--ink:#E9F0EA;--faint:#74857A;--acc:#4FBF8E}
*{box-sizing:border-box}
body{margin:0;width:560px;background:var(--bg);color:var(--ink);font-family:'Onest',sans-serif;padding:24px}
h1{font-size:17px;font-weight:800;margin:0 0 14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--card);border:1px solid #2A3A32;border-radius:16px;padding:14px 12px}
.nm{font-size:12.5px;font-weight:800;margin:0 0 8px}
.big{display:grid;place-items:center;height:110px;background:#0F1613;border-radius:12px;color:var(--acc)}
.sizes{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;padding:9px;background:#0F1613;border-radius:12px;color:var(--ink)}
.circ{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:8px;padding:9px;background:#0F1613;border-radius:12px}
.av{background:#1F6B4E;border-radius:50%;display:grid;place-items:center;color:#F2F4EC}
.u{display:grid;justify-items:center}.cap{font-size:9px;color:var(--faint);margin-top:3px}
.g{filter:invert(78%) sepia(35%) saturate(700%) hue-rotate(96deg)}
.w{filter:brightness(0) invert(1)}
</style></head><body>
<h1>Плътно вместо контур</h1><div class="row">
<div class="card"><div class="nm">М4 · Пържола с кокал</div>
<div class="big"><img src="m4-solid.svg" width="84" class="g"></div>
<div class="sizes">
  <span class="u"><img src="m4-solid.svg" width="40" class="g"><span class="cap">40</span></span>
  <span class="u"><img src="m4-solid.svg" width="28" class="g"><span class="cap">28</span></span>
  <span class="u"><img src="m4-solid.svg" width="18" class="g"><span class="cap">18</span></span>
</div>
<div class="circ">
  <span class="av" style="width:62px;height:62px"><img src="m4-solid.svg" width="34" class="w"></span>
  <span class="av" style="width:40px;height:40px"><img src="m4-solid.svg" width="22" class="w"></span>
</div></div>
<div class="card"><div class="nm">М5 · Парче с прорези</div>
<div class="big"><img src="m5-solid2.svg" width="84" class="g"></div>
<div class="sizes">
  <span class="u"><img src="m5-solid2.svg" width="40" class="g"><span class="cap">40</span></span>
  <span class="u"><img src="m5-solid2.svg" width="28" class="g"><span class="cap">28</span></span>
  <span class="u"><img src="m5-solid2.svg" width="18" class="g"><span class="cap">18</span></span>
</div>
<div class="circ">
  <span class="av" style="width:62px;height:62px"><img src="m5-solid2.svg" width="34" class="w"></span>
  <span class="av" style="width:40px;height:40px"><img src="m5-solid2.svg" width="22" class="w"></span>
</div></div>
</div></body></html>
