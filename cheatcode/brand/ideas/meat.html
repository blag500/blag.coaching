<!doctype html><html lang="bg"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#E9F0EA;--soft:#A3B3A7;--faint:#74857A;--acc:#4FBF8E;--bg:#141C18;--card:#1B251F}
*{box-sizing:border-box}
body{margin:0;width:760px;background:var(--bg);color:var(--ink);font-family:'Onest',sans-serif;padding:26px 24px}
h1{font-size:18px;font-weight:800;margin:0 0 16px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--card);border:1px solid #2A3A32;border-radius:16px;padding:15px 13px 13px}
.nm{font-size:13px;font-weight:800;margin:0 0 8px}
.big{display:grid;place-items:center;height:112px;background:#0F1613;border-radius:12px;color:var(--acc)}
.sizes{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;padding:9px;background:#0F1613;border-radius:12px}
.circ{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:8px;padding:9px;background:#0F1613;border-radius:12px}
.av{background:#1F6B4E;border-radius:50%;display:grid;place-items:center}
.u{display:grid;justify-items:center}.cap{font-size:9px;color:var(--faint);margin-top:3px}
.g{filter:invert(78%) sepia(35%) saturate(700%) hue-rotate(96deg)}
.w{filter:brightness(0) invert(1)}
</style></head><body>
<h1>Месо срещу купа — четимост на истински размери</h1>
<div class="row">
<div class="card"><div class="nm">М1 · Пържола с кокал</div>
<div class="big"><img src="m1-tbone.svg" width="84" class="g"></div>
<div class="sizes">
  <span class="u"><img src="m1-tbone.svg" width="40" class="g"><span class="cap">40</span></span>
  <span class="u"><img src="m1-tbone.svg" width="28" class="g"><span class="cap">28</span></span>
  <span class="u"><img src="m1-tbone.svg" width="18" class="g"><span class="cap">18</span></span>
</div>
<div class="circ">
  <span class="av" style="width:62px;height:62px"><img src="m1-tbone.svg" width="36" class="w"></span>
  <span class="av" style="width:40px;height:40px"><img src="m1-tbone.svg" width="24" class="w"></span>
</div></div>
<div class="card"><div class="nm">М2 · Парче със скара</div>
<div class="big"><img src="m2-cut.svg" width="84" class="g"></div>
<div class="sizes">
  <span class="u"><img src="m2-cut.svg" width="40" class="g"><span class="cap">40</span></span>
  <span class="u"><img src="m2-cut.svg" width="28" class="g"><span class="cap">28</span></span>
  <span class="u"><img src="m2-cut.svg" width="18" class="g"><span class="cap">18</span></span>
</div>
<div class="circ">
  <span class="av" style="width:62px;height:62px"><img src="m2-cut.svg" width="36" class="w"></span>
  <span class="av" style="width:40px;height:40px"><img src="m2-cut.svg" width="24" class="w"></span>
</div></div>
<div class="card"><div class="nm">М3 · Купа с пара</div>
<div class="big"><img src="m3-bowl.svg" width="84" class="g"></div>
<div class="sizes">
  <span class="u"><img src="m3-bowl.svg" width="40" class="g"><span class="cap">40</span></span>
  <span class="u"><img src="m3-bowl.svg" width="28" class="g"><span class="cap">28</span></span>
  <span class="u"><img src="m3-bowl.svg" width="18" class="g"><span class="cap">18</span></span>
</div>
<div class="circ">
  <span class="av" style="width:62px;height:62px"><img src="m3-bowl.svg" width="36" class="w"></span>
  <span class="av" style="width:40px;height:40px"><img src="m3-bowl.svg" width="24" class="w"></span>
</div></div>
</div></body></html>
