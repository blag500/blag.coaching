<!-- Вариант за 24 пиксела и надолу: по-дебел ход и по-широко заплитане,
     за да не се слее в петно. Същият знак, оцелял. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Cheat Code">
  <title>Cheat Code</title>
  <defs>
    <mask id="ccChainCutS">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="28" y="22" width="30" height="20" rx="10"
            fill="none" stroke="#000" stroke-width="15"/>
    </mask>
  </defs>
  <g transform="rotate(-35 32 32)" fill="none" stroke="currentColor"
     stroke-width="7" stroke-linecap="round">
    <rect x="6" y="22" width="30" height="20" rx="10" mask="url(#ccChainCutS)"/>
    <rect x="28" y="22" width="30" height="20" rx="10"/>
  </g>
</svg>
