<!doctype html>
<!-- Шапката на писмата на Чийт Код. Пощенските програми не показват SVG и режат
     градиентите, затова шапката е картинка: земята на страницата (тъмната
     тема, същите три сияния) и словният знак от board/art/lockup-dark.svg.
     Рисува се с `node scripts/build-mail-art.mjs` → public/cheatcode/mail-hero.png -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; }
  .hero {
    width: 600px; height: 190px; position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse 110% 90% at 50% -20%, rgba(79, 191, 142, 0.26) 0%, transparent 62%),
      radial-gradient(ellipse 70% 80% at 6% 70%, rgba(79, 191, 142, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse 80% 90% at 96% 110%, rgba(90, 120, 200, 0.12) 0%, transparent 62%),
      #141C18;
    display: grid; place-items: center;
  }
  .lockup { width: 420px; display: block; }
  .tag {
    position: absolute; left: 0; right: 0; bottom: 30px; text-align: center;
    font: 500 19px/1 -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #A3B3A7; letter-spacing: 0.01em;
  }
  .box { display: grid; justify-items: center; gap: 0; transform: translateY(-12px); }
</style></head><body>
  <div class="hero">
    <div class="box"><img class="lockup" src="../board/art/lockup-dark.svg" alt=""></div>
    <p class="tag">Храната, която си знае числата ;)</p>
  </div>
</body></html>
