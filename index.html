<!DOCTYPE html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BLAG COACHING — тренировка, хранене и навици на едно място</title>
    <!-- PWA iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blag" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/icon-192.png" />
    <!-- Theme -->
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="description" content="Приложението, което постига целите ти. Тренировка, хранене, тегло и навици на едно място — и треньор, който ги гледа." />

    <!-- What a shared link looks like.
         Without these, Messenger and Viber scrape whatever they can find and
         show the app icon next to a line of text nobody wrote for the purpose.
         The image has to be an absolute address: the scraper is not on this
         site and has nothing to resolve a leading slash against. -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="BLAG COACHING" />
    <meta property="og:locale"      content="bg_BG" />
    <meta property="og:url"         content="https://blag-coaching.com/" />
    <meta property="og:title"       content="BLAG COACHING" />
    <meta property="og:description" content="Приложението, което постига целите ти. Тренировка, хранене, тегло и навици на едно място — и треньор, който ги гледа." />
    <meta property="og:image"       content="https://blag-coaching.com/og.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="BLAG COACHING" />

    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="BLAG COACHING" />
    <meta name="twitter:description" content="Приложението, което постига целите ти." />
    <meta name="twitter:image"       content="https://blag-coaching.com/og.jpg" />
    <!-- Asked for here rather than from inside the stylesheet. An @import is
         found only after the CSS bundle has been fetched and parsed, which put
         two fresh DNS lookups behind it and left the first screen drawn in the
         fallback face for most of a second. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap&subset=cyrillic,latin"
    />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-64XXVZSD8C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-64XXVZSD8C', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
